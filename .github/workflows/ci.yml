name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Direct Mode test tooling
        run: python -m pip install genlayer-test
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Frontend tests
        run: npm run test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Contract static validation
        run: python -m pytest tests/direct/test_contract_source.py
      # genlayer-test 0.29.2 currently requests a deleted GenVM release asset
      # (HTTP 404). Keep the behavioral suite visible and non-blocking until the
      # upstream runner publishes a compatible artifact; do not hide its result.
      - name: Contract behavioral Direct Mode (upstream runner currently broken)
        continue-on-error: true
        run: python -m pytest tests/direct/test_contract_behavior.py
