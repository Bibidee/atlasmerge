name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Direct Mode test tooling
        # PyPI's 0.1.x line is an unrelated legacy package and does not
        # provide the gltest.direct API used here. Pin the official GenLayer
        # testing-suite release commit so hosted CI matches local Direct Mode.
        run: python -m pip install -r requirements-direct.txt
      - name: Cache pinned GenVM Direct Mode artifact
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-direct-v0.3.0-rc7-linux-${{ runner.arch }}
      - name: Seed pinned GenVM Direct Mode artifact
        run: |
          mkdir -p ~/.cache/gltest-direct
          test -f ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz || \
            curl --fail --location --retry 3 \
            https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
            --output ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web
      - name: Restore optional native frontend binaries
        # npm can omit platform-specific optional Rollup packages when the
        # lockfile was produced on another OS. Install the exact Rollup
        # companion without changing the pinned lockfile so Vitest/Next run
        # on Ubuntu.
        run: npm install --workspace @atlasmerge/web --no-save --ignore-scripts --no-audit --no-fund @rollup/rollup-linux-x64-gnu@4.62.5
      - name: Frontend tests
        run: npm run test --workspace @atlasmerge/web
      - name: Typecheck
        run: npm run typecheck --workspace @atlasmerge/web
      - name: Lint
        run: npm run lint --workspace @atlasmerge/web
      - name: Production build
        run: npm run build --workspace @atlasmerge/web
      - name: Contract static validation
        run: python -m pytest tests/direct/test_contract_source.py
      # This is deliberately blocking: a green workflow must mean the suite ran.
      - name: Contract behavioral Direct Mode
        run: python -m pytest tests/direct/test_contract_behavior.py
